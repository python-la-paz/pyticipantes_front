name: Docker Image CI

on:
  push:
    branches: [main, develop]
env:
  IMAGE_TAG: ${{ github.sha }}
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
  DOCKER_GCR: ${{ vars.DOCKER_GCR }}
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Configure Tags
        run: |
          TAG=$(git describe --tags --abbrev=7 --always)
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Version: $TAG"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to GCR
        uses: docker/login-action@v2
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set Image Tag based on branch
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
            echo "IMAGE_TAG_LATEST=latest" >> $GITHUB_ENV
          elif [ "${{ github.ref_name }}" == "develop" ]; then
            echo "IMAGE_TAG=dev_${{ github.sha }}" >> $GITHUB_ENV
            echo "IMAGE_TAG_LATEST=develop" >> $GITHUB_ENV
          fi
      - name: Pull existing image from registry
        run: |
          docker pull ${{env.DOCKER_GCR}}/${{env.DOCKER_IMAGE}}:${{ env.IMAGE_TAG_LATEST }} || true

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL_ARG=${{env.NEXT_PUBLIC_API_URL}}
          tags: |
            ${{env.DOCKER_GCR}}/${{env.DOCKER_IMAGE}}:${{ env.IMAGE_TAG_LATEST }}
            ${{env.DOCKER_GCR}}/${{env.DOCKER_IMAGE}}:${{env.IMAGE_TAG}}
            ${{env.DOCKER_GCR}}/${{env.DOCKER_IMAGE}}:${{env.TAG}}
          cache-from: type=registry,ref=${{env.DOCKER_GCR}}/${{env.DOCKER_IMAGE}}:${{ env.IMAGE_TAG_LATEST }}
          cache-to: type=registry,ref=${{env.DOCKER_GCR}}/${{env.DOCKER_IMAGE}}:${{ env.IMAGE_TAG_LATEST }},mode=max
